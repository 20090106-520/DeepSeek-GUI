<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek GUI</title>
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0c0a1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

.stage{position:fixed;inset:0;z-index:1000;overflow:hidden;background:#0c0a1a}

#bgCanvas{position:absolute;inset:0;z-index:0}

.noise{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");background-size:128px 128px}

.scanline{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);mix-blend-mode:multiply}

.vignette{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at center,transparent 50%,rgba(8,6,20,0.5) 100%);pointer-events:none}

.film-bar{position:absolute;left:0;right:0;height:0;background:#0c0a1a;z-index:90;will-change:height}
.film-bar.top{top:0}
.film-bar.bot{bottom:0}

.flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.flash.white{z-index:70;background:#fff}
.flash.warm{z-index:69;background:radial-gradient(circle at 50% 45%,rgba(124,92,252,0.5),rgba(78,205,196,0.25),transparent 70%)}

.logo-scene{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;will-change:transform}

.logo-wrap{position:relative;width:100px;height:100px;margin-bottom:24px;transform-style:preserve-3d}

.orbit-ring{position:absolute;border-radius:50%;border:1px solid;opacity:0;transform-style:preserve-3d}
.orbit-ring.r1{inset:-20px;border-color:rgba(124,92,252,0.12);animation:orbitSpin1 8s linear infinite}
.orbit-ring.r2{inset:-36px;border-color:rgba(78,205,196,0.08);animation:orbitSpin2 12s linear infinite}
.orbit-dot{position:absolute;width:3px;height:3px;border-radius:50%;top:-1.5px;left:50%;margin-left:-1.5px}
.orbit-ring.r1 .orbit-dot.d1{background:#7C5CFC;box-shadow:0 0 8px #7C5CFC}
.orbit-ring.r1 .orbit-dot.d2{left:auto;right:50%;margin-right:-1.5px;top:auto;bottom:-1.5px;background:#9B7CFC;box-shadow:0 0 8px #9B7CFC}
.orbit-ring.r2 .orbit-dot.d1{background:#4ECDC4;box-shadow:0 0 8px #4ECDC4}
.orbit-ring.r2 .orbit-dot.d2{left:50%;margin-left:-1.5px;top:auto;bottom:-1.5px;background:#6EDDC4;box-shadow:0 0 8px #6EDDC4}

@keyframes orbitSpin1{from{transform:rotateX(65deg) rotateZ(0deg)}to{transform:rotateX(65deg) rotateZ(360deg)}}
@keyframes orbitSpin2{from{transform:rotateX(55deg) rotateY(20deg) rotateZ(0deg)}to{transform:rotateX(55deg) rotateY(20deg) rotateZ(-360deg)}}

.logo-frame{position:absolute;inset:0;border-radius:24px;background:linear-gradient(145deg,rgba(22,18,42,0.95),rgba(14,11,32,0.98));border:1.5px solid rgba(124,92,252,0.25);display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;transform:scale(0) rotateY(0deg);box-shadow:0 0 0 1px rgba(124,92,252,0.05),0 4px 20px rgba(124,92,252,0.15),0 0 60px rgba(124,92,252,0.08),inset 0 1px 0 rgba(255,255,255,0.04);will-change:transform,opacity}

.logo-frame svg{width:56px;height:56px;opacity:0;filter:drop-shadow(0 0 16px rgba(124,92,252,0.4))}

.logo-frame svg path{stroke-dasharray:200;strokeDashoffset:200;fill:transparent;stroke:url(#whaleStroke);stroke-width:0.3}

.logo-glint{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,0.03) 42%,rgba(255,255,255,0.08) 48%,rgba(255,255,255,0.03) 54%,transparent 62%);background-size:250% 100%;background-position:100% 0;opacity:0;pointer-events:none}

.shockwave{position:absolute;z-index:9;border-radius:50%;border:2px solid rgba(124,92,252,0.6);pointer-events:none;opacity:0;will-change:transform,opacity}
.shockwave.s1{width:60px;height:60px;top:50%;left:50%;margin:-30px 0 0 -30px}
.shockwave.s2{width:60px;height:60px;top:50%;left:50%;margin:-30px 0 0 -30px}

.god-rays{position:absolute;inset:-30px;z-index:8;pointer-events:none;opacity:0;will-change:transform}
.god-ray{position:absolute;top:50%;left:50%;width:1.5px;height:100px;transform-origin:top center;opacity:0.12;background:linear-gradient(to bottom,rgba(124,92,252,0.5),rgba(78,205,196,0.15),transparent)}

.energy-pulse{position:absolute;z-index:9;border-radius:50%;border:1px solid rgba(124,92,252,0.3);pointer-events:none;opacity:0;width:100px;height:100px;top:50%;left:50%;margin:-50px 0 0 -50px;will-change:transform,opacity}

.logo-breathe{position:absolute;inset:-12px;border-radius:30px;opacity:0;pointer-events:none;background:radial-gradient(circle,rgba(124,92,252,0.12) 0%,transparent 70%);filter:blur(10px)}

.logo-frame.alive{animation:logoBreath 4s ease-in-out infinite}
@keyframes logoBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}

.title-group{text-align:center;opacity:0;position:relative}
.title-main{font-size:28px;font-weight:700;letter-spacing:8px;line-height:1.1;position:relative;overflow:hidden}
.title-main .char{display:inline-block;opacity:0;transform:translateY(20px) scale(0.8);filter:blur(6px);position:relative}
.title-shimmer{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,0.15) 45%,rgba(255,255,255,0.3) 50%,rgba(255,255,255,0.15) 55%,transparent 70%);background-size:300% 100%;background-position:100% 0;opacity:0;pointer-events:none}
.title-sub{font-size:9px;font-weight:400;letter-spacing:8px;color:rgba(200,195,220,0.35);margin-top:8px;opacity:0;transform:translateY(6px);text-transform:uppercase}

.progress-wrap{width:200px;opacity:0;margin-top:28px;position:relative}
.prog-bg{width:100%;height:1px;background:rgba(255,255,255,0.03);border-radius:1px;position:relative;overflow:visible}
.prog-fill{width:0%;height:100%;border-radius:1px;position:relative;background:linear-gradient(90deg,#7C5CFC,#4ECDC4)}
.prog-fill::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);animation:progPulse 2s ease-in-out infinite;opacity:0}
.prog-fill.pulsing::before{opacity:1}
@keyframes progPulse{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.prog-glow{position:absolute;right:-5px;top:-5px;width:11px;height:11px;border-radius:50%;background:#7C5CFC;box-shadow:0 0 10px rgba(124,92,252,0.8),0 0 24px rgba(124,92,252,0.4);opacity:0}
.prog-pct{position:absolute;right:0;top:-16px;font-size:7px;font-weight:300;color:rgba(124,92,252,0.25);letter-spacing:1px;font-variant-numeric:tabular-nums;opacity:0}
.prog-text{font-size:8px;font-weight:300;color:rgba(200,195,220,0.15);margin-top:14px;letter-spacing:3px;text-align:center;font-variant-numeric:tabular-nums}

.tags{display:flex;gap:6px;margin-top:20px;opacity:0;flex-wrap:wrap;justify-content:center}
.tag{padding:3px 12px;border-radius:100px;font-size:7px;font-weight:400;letter-spacing:1px;border:1px solid rgba(124,92,252,0.12);background:rgba(124,92,252,0.03);color:rgba(200,195,220,0.35);opacity:0;transform:translateY(8px) scale(0.9)}

.ver{position:absolute;bottom:16px;font-size:7px;font-weight:300;color:rgba(200,195,220,0.08);letter-spacing:3px;opacity:0;z-index:10}

#particleCanvas{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0}

.stage.fade-out{pointer-events:none}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
}
</style>
</head>

<script>
(function(){
  var cv = document.getElementById('bgCanvas');
  var c = cv.getContext('2d');
  var W, H;

  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize();
  addEventListener('resize', resize);

  var stars = [];
  for (var i = 0; i < 160; i++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 1.0 + 0.15,
      bright: 0.3 + Math.random() * 0.7,
      speed: 0.003 + Math.random() * 0.015,
      phase: Math.random() * 6.283,
      hue: 240 + Math.random() * 80,
      hasCross: Math.random() < 0.06
    });
  }

  var nebulae = [];
  for (var i = 0; i < 6; i++) {
    nebulae.push({
      x: 0.1 + Math.random() * 0.8,
      y: 0.05 + Math.random() * 0.55,
      size: 60 + Math.random() * 150,
      hue: [260, 280, 300, 180, 200, 320][i],
      alpha: 0.015 + Math.random() * 0.04,
      phase: Math.random() * 6.283,
      speed: 0.0008 + Math.random() * 0.003,
      drift: 0.008 + Math.random() * 0.025
    });
  }

  var meteors = [];
  function spawnMeteor() {
    meteors.push({
      x: Math.random() * W * 0.8 + W * 0.1,
      y: -20,
      vx: -2 - Math.random() * 3,
      vy: 4 + Math.random() * 6,
      life: 1,
      len: 40 + Math.random() * 80,
      w: 0.4 + Math.random() * 0.6
    });
  }
  setInterval(function() { if (Math.random() < 0.2) spawnMeteor(); }, 3000);

  var t = 0, gA = 0;

  function draw() {
    t++;
    if (gA < 1) gA = Math.min(1, gA + 0.005);
    c.clearRect(0, 0, W, H);

    var bg = c.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
    bg.addColorStop(0, '#14102a');
    bg.addColorStop(0.4, '#0e0b20');
    bg.addColorStop(1, '#0c0a1a');
    c.fillStyle = bg;
    c.fillRect(0, 0, W, H);

    for (var i = 0; i < nebulae.length; i++) {
      var n = nebulae[i];
      var nx = (n.x + Math.sin(t * n.speed + n.phase) * n.drift) * W;
      var ny = n.y * H + Math.cos(t * 0.004 + n.phase) * 20;
      var gr = c.createRadialGradient(nx, ny, 0, nx, ny, n.size);
      gr.addColorStop(0, 'hsla(' + n.hue + ',65%,55%,' + (n.alpha * gA) + ')');
      gr.addColorStop(0.5, 'hsla(' + n.hue + ',55%,45%,' + (n.alpha * 0.4 * gA) + ')');
      gr.addColorStop(1, 'transparent');
      c.fillStyle = gr;
      c.beginPath();
      c.arc(nx, ny, n.size, 0, 6.283);
      c.fill();
    }

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var fl = 0.3 + 0.7 * Math.sin(t * s.speed + s.phase);
      var al = s.bright * fl * gA;
      if (al < 0.01) continue;
      c.fillStyle = 'hsla(' + s.hue + ',30%,88%,' + al + ')';
      c.beginPath();
      c.arc(s.x * W, s.y * H, s.r, 0, 6.283);
      c.fill();
      if (s.hasCross && al > 0.4) {
        var l = s.r * 6 * fl;
        c.strokeStyle = 'hsla(' + s.hue + ',40%,90%,' + (al * 0.25) + ')';
        c.lineWidth = 0.3;
        c.beginPath();
        c.moveTo(s.x * W - l, s.y * H);
        c.lineTo(s.x * W + l, s.y * H);
        c.moveTo(s.x * W, s.y * H - l);
        c.lineTo(s.x * W, s.y * H + l);
        c.stroke();
      }
    }

    for (var i = meteors.length - 1; i >= 0; i--) {
      var m = meteors[i];
      m.x += m.vx; m.y += m.vy; m.life -= 0.008;
      if (m.life <= 0) { meteors.splice(i, 1); continue; }
      var al = m.life * gA;
      var hyp = Math.hypot(m.vx, m.vy);
      var gr = c.createLinearGradient(m.x, m.y, m.x - m.vx / hyp * m.len, m.y - m.vy / hyp * m.len);
      gr.addColorStop(0, 'rgba(200,195,220,' + (al * 0.9) + ')');
      gr.addColorStop(0.3, 'rgba(124,92,252,' + (al * 0.4) + ')');
      gr.addColorStop(1, 'transparent');
      c.strokeStyle = gr;
      c.lineWidth = m.w;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(m.x, m.y);
      c.lineTo(m.x - m.vx / hyp * m.len, m.y - m.vy / hyp * m.len);
      c.stroke();
    }

    requestAnimationFrame(draw);
  }
  draw();
})();

(function(){
  var cv = document.getElementById('particleCanvas');
  var c = cv.getContext('2d');
  var W, H;

  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize();
  addEventListener('resize', resize);

  var particles = [];

  window.startConverge = function() {
    for (var i = 0; i < 50; i++) {
      var angle = Math.random() * 6.283;
      var dist = 150 + Math.random() * 250;
      particles.push({
        x: W / 2 + Math.cos(angle) * dist,
        y: H / 2 + Math.sin(angle) * dist,
        tx: W / 2, ty: H / 2,
        size: 1 + Math.random() * 2,
        alpha: 0.3 + Math.random() * 0.5,
        speed: 0.012 + Math.random() * 0.025,
        hue: [260, 180, 320, 200][Math.floor(Math.random() * 4)],
        life: 1,
        type: 'converge',
        trail: []
      });
    }
  };

  window.startExplode = function() {
    for (var i = 0; i < 30; i++) {
      var angle = Math.random() * 6.283;
      var speed = 2 + Math.random() * 5;
      particles.push({
        x: W / 2, y: H / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 1 + Math.random() * 2,
        alpha: 0.5 + Math.random() * 0.5,
        hue: [260, 180, 320][Math.floor(Math.random() * 3)],
        life: 1,
        decay: 0.006 + Math.random() * 0.012,
        type: 'explode',
        trail: []
      });
    }
  };

  for (var i = 0; i < 20; i++) {
    particles.push({
      x: Math.random() * (innerWidth || 420),
      y: Math.random() * (innerHeight || 320),
      size: 0.5 + Math.random() * 1,
      alpha: 0.08 + Math.random() * 0.12,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -0.1 - Math.random() * 0.3,
      hue: 260 + Math.random() * 60,
      life: 999,
      type: 'ambient',
      trail: []
    });
  }

  function draw() {
    c.clearRect(0, 0, W, H);

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];

      if (p.type === 'converge') {
        if (p.trail.length > 6) p.trail.shift();
        p.trail.push({ x: p.x, y: p.y });
        p.x += (p.tx - p.x) * p.speed;
        p.y += (p.ty - p.y) * p.speed;
        var d = Math.hypot(p.x - p.tx, p.y - p.ty);
        if (d < 5) { particles.splice(i, 1); continue; }
        p.alpha *= 0.994;
      } else if (p.type === 'explode') {
        if (p.trail.length > 8) p.trail.shift();
        p.trail.push({ x: p.x, y: p.y });
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.97; p.vy *= 0.97;
        p.life -= p.decay;
        p.alpha = p.life * 0.6;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
      } else if (p.type === 'ambient') {
        p.x += p.vx; p.y += p.vy;
        if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
        if (p.x < -10 || p.x > W + 10) p.x = Math.random() * W;
      }

      if (p.alpha < 0.01) continue;

      if (p.trail.length > 1 && p.type !== 'ambient') {
        for (var j = 0; j < p.trail.length - 1; j++) {
          var ta = p.alpha * (j / p.trail.length) * 0.3;
          c.strokeStyle = 'hsla(' + p.hue + ',60%,70%,' + ta + ')';
          c.lineWidth = p.size * 0.5 * (j / p.trail.length);
          c.beginPath();
          c.moveTo(p.trail[j].x, p.trail[j].y);
          c.lineTo(p.trail[j + 1].x, p.trail[j + 1].y);
          c.stroke();
        }
      }

      c.save();
      c.globalAlpha = p.alpha;
      c.fillStyle = 'hsla(' + p.hue + ',60%,70%,1)';
      c.shadowColor = 'hsla(' + p.hue + ',60%,60%,0.6)';
      c.shadowBlur = p.size * 4;
      c.beginPath();
      c.arc(p.x, p.y, p.size, 0, 6.283);
      c.fill();
      c.restore();
    }

    requestAnimationFrame(draw);
  }
  draw();
})();

(function(){
  var ctx = null;
  window.playBootSound = function() {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(80, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.3);
      osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.8);
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.8);

      var osc2 = ctx.createOscillator();
      var gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(800, ctx.currentTime + 0.15);
      osc2.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.5);
      gain2.gain.setValueAtTime(0, ctx.currentTime + 0.15);
      gain2.gain.linearRampToValueAtTime(0.02, ctx.currentTime + 0.25);
      gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc2.connect(gain2); gain2.connect(ctx.destination);
      osc2.start(ctx.currentTime + 0.15); osc2.stop(ctx.currentTime + 0.6);
    } catch(e) {}
  };

  window.playRevealSound = function() {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523.25, 659.25, 783.99].forEach(function(freq, idx) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        var start = ctx.currentTime + idx * 0.08;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.03, start + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.6);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(start); osc.stop(start + 0.6);
      });
    } catch(e) {}
  };

  window.playCompleteSound = function() {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523.25, 659.25, 783.99, 1046.5].forEach(function(freq, idx) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        var start = ctx.currentTime + idx * 0.1;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.04, start + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.8);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(start); osc.stop(start + 0.8);
      });
    } catch(e) {}
  };
})();
