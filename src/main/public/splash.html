<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek GUI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0a0e1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .splash-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    position: relative;
    z-index: 2;
  }

  /* Logo container */
  .logo-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-svg {
    width: 88px;
    height: 65px;
    opacity: 0;
    filter: drop-shadow(0 0 20px rgba(77, 107, 254, 0.6));
    animation: logoReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  }

  @keyframes logoReveal {
    0% { opacity: 0; transform: scale(0.6) rotate(-8deg); filter: drop-shadow(0 0 0 rgba(77, 107, 254, 0)); }
    60% { opacity: 1; transform: scale(1.08) rotate(1deg); filter: drop-shadow(0 0 30px rgba(77, 107, 254, 0.8)); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 20px rgba(77, 107, 254, 0.6)); }
  }

  /* Glow ring behind logo */
  .glow-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px solid rgba(77, 107, 254, 0.15);
    animation: ringPulse 2.4s ease-in-out 0.8s infinite;
  }
  .glow-ring:nth-child(2) {
    inset: -22px;
    border-color: rgba(77, 107, 254, 0.08);
    animation-delay: 1.2s;
  }

  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  /* Brand text */
  .brand-text {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0;
    animation: textFadeIn 0.8s ease-out 0.9s forwards;
  }

  .brand-name {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #4d6bfe 0%, #7b8ffd 40%, #a0b4ff 70%, #4d6bfe 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: textFadeIn 0.8s ease-out 0.9s forwards, shimmer 3s linear 1.5s infinite;
  }

  .brand-sub {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 5px;
    color: rgba(123, 143, 253, 0.5);
    text-transform: uppercase;
  }

  @keyframes textFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Loading bar */
  .loading-bar-wrap {
    width: 180px;
    height: 3px;
    background: rgba(77, 107, 254, 0.12);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    animation: textFadeIn 0.6s ease-out 1.4s forwards;
  }

  .loading-bar {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    background: linear-gradient(90deg, #4d6bfe, #7b8ffd, #4d6bfe);
    background-size: 200% 100%;
    animation: loadProgress 2.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.6s forwards, shimmer 1.5s linear 1.6s infinite;
  }

  @keyframes loadProgress {
    0% { width: 0%; }
    20% { width: 25%; }
    50% { width: 55%; }
    80% { width: 82%; }
    100% { width: 100%; }
  }

  /* Background particles */
  .particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(77, 107, 254, 0.4);
    animation: particleFloat linear infinite;
  }

  @keyframes particleFloat {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
  }

  /* Gradient orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0;
    animation: orbReveal 1.5s ease-out forwards;
  }

  .orb-1 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(77, 107, 254, 0.25), transparent 70%);
    top: -80px; left: -60px;
    animation-delay: 0.2s;
  }

  .orb-2 {
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(123, 143, 253, 0.15), transparent 70%);
    bottom: -60px; right: -40px;
    animation-delay: 0.5s;
  }

  .orb-3 {
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(77, 107, 254, 0.12), transparent 70%);
    top: 50%; right: 20%;
    animation-delay: 0.8s;
  }

  @keyframes orbReveal {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Scan line effect */
  .scan-line {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(77, 107, 254, 0.3), transparent);
    animation: scanDown 3s ease-in-out 1s infinite;
    z-index: 1;
  }

  @keyframes scanDown {
    0% { top: -1px; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }
</style>
</head>
<body>
  <!-- Background effects -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="scan-line"></div>
  <div class="particles" id="particles"></div>

      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">DEEPSEEK</span>
      <span class="brand-sub">GUI</span>
    </div>
    <div class="loading-bar-wrap">
      <div class="loading-bar"></div>
    </div>
  </div>

  <script>
    (function() {
      var container = document.getElementById('particles');
      var count = 30;
      for (var i = 0; i < count; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (Math.random() * 100) + '%';
        p.style.bottom = -(Math.random() * 20) + '%';
        p.style.animationDuration = (4 + Math.random() * 6) + 's';
        p.style.animationDelay = (Math.random() * 4) + 's';
        p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
        p.style.opacity = 0.2 + Math.random() * 0.4;
        container.appendChild(p);
      }
    })();
  </script>
</body>
</html>
