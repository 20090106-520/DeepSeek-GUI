name: Tag Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/DeepSeek-GUI-*-win-x64.exe
            dist/DeepSeek-GUI-*-win-x64.exe.blockmap
            dist/latest.yml

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/DeepSeek-GUI-*-linux-x86_64.AppImage
            dist/DeepSeek-GUI-*-linux-x86_64.AppImage.blockmap
            dist/latest-linux.yml

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/DeepSeek-GUI-*-mac-*.dmg
            dist/DeepSeek-GUI-*-mac-*.zip
            dist/DeepSeek-GUI-*-mac-*.blockmap
            dist/latest-mac.yml

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
      - build-macos
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      - name: Generate changelog from commits
        id: changelog
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [[ -n "${PREV_TAG}" ]]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -20)
          fi

          {
            echo "tag=${TAG_NAME}"
            echo "prev_tag=${PREV_TAG}"
          } >> "$GITHUB_OUTPUT"

          cat > release-notes.md << EOF
          ## ${TAG_NAME}

          ### Changes
          ${CHANGES}

          ---

          ### Build Info
          - Commit: \`${GITHUB_SHA::7}\`
          - Platforms: macOS arm64/x64, Windows x64, Linux x64
          EOF

      - name: Create GitHub Release
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --notes-file release-notes.md
          else
            gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Upload GitHub Release assets
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          mapfile -d '' assets < <(
            find release-artifacts -type f \
              \( -name 'DeepSeek-GUI-*' -o -name 'latest*.yml' \) \
              -print0
          )
          if [[ "${#assets[@]}" -gt 0 ]]; then
            gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
          fi

      - name: Publish release
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release edit "${TAG_NAME}" --draft=false --prerelease=false --latest